<!DOCTYPE html>
<html>
<head>
    <title>Sign Language Prediction</title>
</head>
<body>
    <h1>Sign Language Prediction Viewer</h1>
    <p id="prediction">Waiting for prediction...</p>
    <script>
        async function fetchPrediction() {
            const res = await fetch('http://localhost:5000/predict');
            const data = await res.json();
            document.getElementById('prediction').textContent = "Prediction: " + data.prediction;
        }

        // Simulate polling
        setInterval(fetchPrediction, 2000);
    </script>
</body>
</html>
